{% extends 'base.html' %}
{% block login_content %}
<form method="POST" action="{{ url_for('login') }}" autocomplete="off">
  <div class="form-group">
    <label for="username" class="form-label">Username</label>
    <input type="text" id="username" name="username" class="form-control"
           placeholder="Enter admin username" required autofocus>
  </div>
  <div class="form-group">
    <label for="password" class="form-label">Password</label>
    <input type="password" id="password" name="password" class="form-control"
           placeholder="••••••••" required>
  </div>
  <button type="submit" class="btn" style="width:100%;justify-content:center;margin-top:1rem;padding:.75rem;">
    🔐 Sign In
  </button>
  <p style="text-align:center;margin-top:1rem;font-size:.78rem;color:var(--text-muted);">
    Default: admin / admin123
  </p>
</form>
{% endblock %}
